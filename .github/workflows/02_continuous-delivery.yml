name: 02-Continuous-Delivery

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "01-PR-Validation-Gate"
    types:
      - completed
    branches:
      - master

jobs:
  # ---------------------------------------------------------
  # Step 1: Automated Dev Deploy
  # Runs when CI succeeds or when manually triggered
  # ---------------------------------------------------------
  deploy_dev:
    name: Deploy to Dev
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials via OIDC (Dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Dev Stage
        env:
          GO_GAME_TABLE_NAME: ${{ vars.GO_GAME_TABLE_NAME }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: pnpm ship --stage ${{ vars.STAGE }}

  # ---------------------------------------------------------
  # Step 2: Production Deploy
  # Pauses for manual approval via the prod environment
  # ---------------------------------------------------------
  deploy_prod:
    name: Deploy to Production
    needs: deploy_dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug Environment Variables
        run: |
          echo "AWS_REGION=${{ vars.AWS_REGION }}"
          echo "STAGE=${{ vars.STAGE }}"

      - name: Configure AWS Credentials via OIDC (Prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Production Stage
        env:
          STAGE: prod
          GO_GAME_TABLE_NAME: ${{ vars.GO_GAME_TABLE_NAME }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
        run: pnpm ship