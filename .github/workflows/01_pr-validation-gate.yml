name: 01-PR-Validation-Gate

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test-e2e